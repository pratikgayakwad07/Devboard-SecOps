apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devboard
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: devboard
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
