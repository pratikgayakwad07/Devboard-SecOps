# Goal - To ensure my running application is free from OWASP top 10 security issues
name: OWASP ZAP DAST Scan

on:
  workflow_call:
    inputs:
      target-url:
        description: URL of the deployed application
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Wait for application to respond
        env:
          TARGET_URL: ${{ inputs.target-url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$TARGET_URL/" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become reachable at $TARGET_URL" >&2
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ inputs.target-url }}
          fail_action: false
          allow_issue_writing: false