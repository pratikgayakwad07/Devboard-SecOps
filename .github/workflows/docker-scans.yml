# Lint Dockerfiles and fail CI on critical image vulnerabilities.

name: Docker Scan

on: 
    workflow_call:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: [backend, frontend]
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: ${{ matrix.app }} Dockerfile Lint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ${{ matrix.app }}/Dockerfile
              
            - name: Build ${{ matrix.app }} image for scanning
              run: docker build -t devboard-${{ matrix.app }}:scan-${{ github.sha }} .
              working-directory: ${{ matrix.app }}

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: devboard-${{ matrix.app }}:scan-${{ github.sha }}
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL'
             
