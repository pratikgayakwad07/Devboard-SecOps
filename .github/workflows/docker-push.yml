# Build and push immutable images to Amazon ECR using GitHub OIDC.
name: Docker Push

on:
    workflow_call:

jobs:
    push:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: [backend, frontend]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push immutable image
              uses: docker/build-push-action@v7
              with:
                context: ./${{ matrix.app }}
                push: true
                tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY_PREFIX }}-${{ matrix.app }}:${{ github.sha }}-${{ github.run_attempt }}