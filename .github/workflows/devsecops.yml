# Goal - To Run End to End DevSecOps CI Pipeline

name: DevSecOps

permissions:
  contents: read

on:
    push:
        branches: [master]

jobs:

    ## ---- CI ----
    # Code Stage 
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    # Secret Scanning
    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    # Dependency Checks
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml

    # Docker Checks
    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit 

    # SonarQube
    sonar-qube:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    # Code Tests
    code-tests:
        uses: ./.github/workflows/code-tests.yml

    # Push immutable containers to ECR.
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,code-tests,sonar-qube,docker-checks,dependency-checks,secret-scanning]
        permissions:
            contents: read
            id-token: write
        secrets: inherit

    ## ---- CD -----
    deploy:
        needs: [docker-push]
        uses: ./.github/workflows/deploy.yml
        permissions:
            contents: read
            id-token: write
        secrets: inherit

    dast-scan:
        needs: [deploy]
        uses: ./.github/workflows/dast.yml
        with:
            target-url: ${{ needs.deploy.outputs.app-url }}
        secrets: inherit